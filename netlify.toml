# example netlify.toml
[build]
  command = "npx prisma generate && npm run build"
  functions = "netlify/functions"
  publish = ".next"

# Optimised images in public/img carry a version in their name (-v1, -v2...):
# a new name ships with every change, so browsers may keep them for a year.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The home hero video keeps its file name: one week of browser cache.
[[headers]]
  for = "/solar-hero.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[functions.sync-ats]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "playwright", "@sparticuz/chromium", "jsdom"]
  included_files = ["node_modules/.prisma/client/**", "node_modules/@sparticuz/chromium/bin/**"]

[functions.sync-ats-background]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "playwright", "@sparticuz/chromium", "jsdom"]
  included_files = ["node_modules/.prisma/client/**", "node_modules/@sparticuz/chromium/bin/**"]

[functions.rewrite-seed-descriptions-background]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"]
  included_files = ["node_modules/.prisma/client/**"]

[functions.seed-rewrite-status]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"]
  included_files = ["node_modules/.prisma/client/**"]

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://ntl.fyi/file-based-build-config
