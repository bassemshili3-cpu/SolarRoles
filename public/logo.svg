<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="70" viewBox="0 0 320 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oh My Job Logo">
  <defs>
    <linearGradient id="pruneGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B2A7F"/>
      <stop offset="100%" stop-color="#E8B84B"/>
    </linearGradient>
  </defs>

  <!-- Icône -->
  <g transform="translate(10,15)">
    <!-- Cercle loupe -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#pruneGoldGradient)" stroke-width="4"/>
    
    <!-- Manche -->
    <line x1="32" y1="32" x2="48" y2="48" stroke="url(#pruneGoldGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Mallette -->
    <rect x="12" y="18" width="16" height="10" rx="2" fill="url(#pruneGoldGradient)"/>
    <rect x="16" y="14" width="8" height="5" rx="2" fill="url(#pruneGoldGradient)"/>
  </g>

  <!-- Texte -->
  <text x="80" y="44" font-family="Inter, Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#2A1140">
    Oh My <tspan fill="#E8B84B">Job</tspan>
  </text>
</svg>